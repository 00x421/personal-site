name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        # rolldown 1.0.1 lock 传递 peer (@napi-rs/wasm-runtime -> @emnapi/*)
        # 在 Linux npm ci 严格校验下误报 Missing 1.11.3, install 兜底
        run: npm ci --legacy-peer-deps || npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      # 与 build 里重复跑一次，只为让失败归因清楚：
      # 「结构/字形断言没过」和「打包炸了」是两类完全不同的修复路径。
      # 这两条断言拦截的是历史上四次「不报错但也没生效」的静默失败，
      # 详见 lib/css-integrity.ts 与 lib/glyph-coverage.ts 的文件头。
      - name: 静态断言（样式表结构 / 字形覆盖）
        run: npm run check
      - name: Build
        run: npm run build
