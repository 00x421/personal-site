name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        # rolldown 1.0.1 lock 传递 peer (@napi-rs/wasm-runtime -> @emnapi/*)
        # 在 Linux npm ci 严格校验下误报 Missing 1.11.3, install 兜底
        run: npm ci --legacy-peer-deps || npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
